services:
  - type: web
    name: workout-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: workout-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "" # Add your frontend URL here !!!!! TODO
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: workout-db
    databaseName: workout
    user: workout_user
    plan: free # Optional: specify plan
